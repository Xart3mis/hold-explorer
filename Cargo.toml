[workspace]
resolver = "2"
members = ["crates/core", "crates/synth", "crates/cli", "crates/store", "crates/export", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# The clipboard of the desktop app: text and images, on Wayland through its data-control protocol.
arboard = { version = "3", features = ["wayland-data-control"] }
calamine = { version = "0.36", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8.42"
fancy-regex = "0.19"
# The PDF report. Without its default features; krilla-svg turns on the raster images it needs.
krilla = { version = "0.8.2", default-features = false }
krilla-svg = "0.8.1"
regex = "1"
# Declared without system-fonts: an image is drawn with the embedded faces only. Pinned so that it
# shares usvg 0.47 with krilla-svg. krilla-svg 0.8.1 asks for resvg and usvg with their default
# features, which turns system-fonts on in the build; no code of this workspace loads a font of
# the machine, and every font database holds the embedded faces only (`hx_export::fonts`).
resvg = { version = "=0.47.0", default-features = false, features = ["text"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tauri = "~2.12"
tauri-build = "~2.7"
tauri-plugin-dialog = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-single-instance = "~2.5"
tauri-plugin-window-state = "~2.5"
thiserror = "2"
# The version fontdb reads faces with.
ttf-parser = "0.25"
ts-rs = { version = "12.0", features = ["chrono-impl"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Debug information is stripped and the symbol table kept, so the backtrace of a crash log names
# its functions on Linux and macOS. On Windows (MSVC) rustc ignores `strip`: every link writes a
# separate `hx_desktop.pdb` that holds the names, and the exe holds only that file's name.
strip = "debuginfo"

# The release build is optimized for size, except where the time of an import and of a query is
# spent: the engine, the store, and SQLite are optimized for speed. The limits these protect are
# in crates/cli/tests/perf.rs.
[profile.release.package.hx-core]
opt-level = 3

[profile.release.package.hx-store]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3
