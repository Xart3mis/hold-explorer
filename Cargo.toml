[workspace]
resolver = "2"
members = ["crates/core", "crates/synth", "crates/cli", "crates/store", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
calamine = { version = "0.36", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8.42"
fancy-regex = "0.19"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
thiserror = "2"
ts-rs = { version = "12.0", features = ["chrono-impl"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
