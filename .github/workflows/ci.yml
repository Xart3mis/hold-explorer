name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold job compiles Tauri several times over (tests, lint, a release build with link-time
    # optimization), and a job that is cancelled saves no build cache, so a limit that a cold job
    # cannot meet is never met. Lower it once warm runs have been measured.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile
      - name: Interface lint
        run: pnpm lint
      - name: Interface type check
        run: pnpm typecheck
      - name: Interface tests
        run: pnpm test
      - name: Bindings
        run: pnpm bindings
      - name: Bindings are up to date
        shell: bash
        run: |
          changes="$(git status --porcelain -- ui/src/bindings)"
          if [ -n "$changes" ]; then
            echo "ui/src/bindings is out of date. Run pnpm bindings and commit the result:"
            echo "$changes"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The code behind the cargo feature `e2e` is built only for the e2e job; lint and test it
      # here too, so that it cannot rot.
      - name: Lint with the e2e feature
        run: cargo clippy -p hx-desktop --features e2e --all-targets --locked -- -D warnings
      - name: Test with the e2e feature
        run: cargo test -p hx-desktop --features e2e --locked
      - name: Performance budget
        run: cargo test --release -p hx-cli --test perf --locked -- --ignored --nocapture
      - name: Build the app
        run: pnpm tauri build --no-bundle
      # The design tests and tools/dist-locales.test.mjs, which reads the built dist.
      - name: Tool tests
        run: node --test "tools/**/*.test.mjs"
      - name: The build names no other host
        run: pnpm check:dist
      - name: Size of the binary, and its manifest on Windows
        shell: bash
        run: |
          bin=target/release/hx-desktop
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          echo "$bin: $(du -m "$bin" | cut -f1) MB"
          # The build script hands the application manifest to the linker. A test executable
          # without it does not start, so the tests check themselves; the smoke run below starts
          # this binary, and this check runs first so that it names the cause of a missing manifest.
          if [ "$RUNNER_OS" = "Windows" ]; then
            if ! grep -a -q "Microsoft.Windows.Common-Controls" "$bin"; then
              echo "$bin holds no application manifest that asks for version 6 of the common controls (Microsoft.Windows.Common-Controls), so it would not start. See the linker arguments in src-tauri/build.rs and src-tauri/windows-app-manifest.xml."
              exit 1
            fi
            echo "$bin holds the application manifest."
          fi
      # The smoke run (src-tauri/src/smoke.rs): with HX_SMOKE=1 the built app renders its first
      # screen, prints `ready <sample>`, and exits with code 0; it exits with code 1 by itself
      # after 60 s. The update check is off in this mode, so the run does not reach GitHub. The
      # sample is a date written by the interface's format module in the system's web view, so
      # this log records how WebView2 writes dates on Windows. The Linux sample is printed here
      # and by the e2e job.
      - name: Start the built app (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          HX_SMOKE: "1"
        run: |
          out="$RUNNER_TEMP/smoke-out.txt"
          err="$RUNNER_TEMP/smoke-err.txt"
          set +e
          timeout --kill-after=10 120 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" target/release/hx-desktop > "$out" 2> "$err"
          code=$?
          set -e
          cat "$err"
          if [ "$code" -ne 0 ]; then
            echo "The app ended with code $code (124 means it did not end within 120 s). Its output:"
            cat "$out"
            exit 1
          fi
          line="$(grep -m 1 '^ready ' "$out" || true)"
          if [ -z "$line" ]; then
            echo "The app ended with code 0 but printed no ready line. Its output:"
            cat "$out"
            exit 1
          fi
          echo "Sample date (WebKitGTK): ${line#ready }"
      - name: Start the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HX_SMOKE: "1"
        run: |
          # The executable has no console, so its output goes to files.
          $out = Join-Path $env:RUNNER_TEMP smoke-out.txt
          $err = Join-Path $env:RUNNER_TEMP smoke-err.txt
          $p = Start-Process -FilePath (Resolve-Path target\release\hx-desktop.exe) -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow -PassThru
          # Reading the handle now keeps the exit code readable after the process ends.
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force
            Write-Output "The app did not end within 120 s. Its output:"
            Get-Content $out, $err
            exit 1
          }
          Get-Content $err
          if ($p.ExitCode -ne 0) {
            Write-Output "The app ended with code $($p.ExitCode). Its output:"
            Get-Content $out
            exit 1
          }
          $line = Get-Content $out | Where-Object { $_ -match '^ready ' } | Select-Object -First 1
          if (-not $line) {
            Write-Output "The app ended with code 0 but printed no ready line. Its output:"
            Get-Content $out
            exit 1
          }
          Write-Output "Sample date (WebView2): $($line.Substring(6))"

  # The end-to-end tests of the built app (e2e/README.md): WebdriverIO drives the build with the
  # cargo feature `e2e` through tauri-driver and WebKitWebDriver, on a virtual display.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb dbus
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile
      # The newest stable tauri-driver, of Tauri 2 (its 3.0 releases are alphas of the next Tauri).
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the app with the e2e feature
        run: pnpm e2e:build
      - name: End-to-end tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm e2e
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: target/e2e/logs
          if-no-files-found: ignore
