[package]
name = "hx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# What `hx-export`, a dependency of its tests, needs (through `krilla`).
rust-version = "1.92"

[[bin]]
name = "hx-cli"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
hx-core = { path = "../core" }
hx-store = { path = "../store" }
hx-synth = { path = "../synth" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
hx-export = { path = "../export" }
tempfile.workspace = true
