[package]
name = "hx-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
# What `hx-export` (through `krilla`) needs.
rust-version = "1.92"

[lib]
name = "hx_desktop"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard.workspace = true
hx-core = { path = "../crates/core", features = ["ts"] }
hx-store = { path = "../crates/store", features = ["ts"] }
hx-export = { path = "../crates/export", features = ["ts"] }
hx-synth = { path = "../crates/synth" }
# The native message of a failed start. The version and features `tauri-plugin-dialog` already
# takes, so the lock gains no crate.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
chrono.workspace = true
# The local data folder before the app exists, read as Tauri's path resolver reads it. The
# version already in the lock through Tauri.
dirs = "7.0"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tempfile.workspace = true
ts-rs.workspace = true
# The one request the app makes, the update check: rustls with the webpki roots (`rustls` turns
# on `rustls-webpki-roots`), no native TLS, no gzip, no cookies.
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[dev-dependencies]
# Already in the lock through hx-core and hx-export: the tests read back the files an export saves.
calamine.workspace = true
csv.workspace = true
rusqlite.workspace = true
rust_xlsxwriter.workspace = true
# The mock runtime: the tests invoke the commands with the arguments the interface sends.
tauri = { workspace = true, features = ["test"] }

[features]
# Turned on by `tauri build`; embeds the built interface. Not a default feature, so
# `cargo clippy --workspace` and `cargo test --workspace` need no `dist/`.
custom-protocol = ["tauri/custom-protocol"]
# The build the end-to-end tests drive: the open and save dialogs are answered with paths read
# from `HX_E2E_OPEN` and `HX_E2E_SAVE_DIR`, and the update check never asks. A build without it
# holds no trace of it.
e2e = []
